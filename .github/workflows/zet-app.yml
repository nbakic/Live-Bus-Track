# CI za Zagreb ZET transit app (L4 iz docs/TODO.md).
#
# Buildaj i testira oba projekta na svaki push/PR koji dira njihov kod:
#  - services/transit-api  (Kotlin/Ktor backend)
#  - apps/zagreb-android    (Android KMP aplikacija)
#
# Split kod (artifacts/) nije pokriven ovim workflowom — ima vlastiti build.

name: zet-app CI

on:
  push:
    branches: [zet-app, master]
    paths:
      - 'apps/zagreb-android/**'
      - 'services/transit-api/**'
      - '.github/workflows/zet-app.yml'
  pull_request:
    paths:
      - 'apps/zagreb-android/**'
      - 'services/transit-api/**'
      - '.github/workflows/zet-app.yml'

jobs:
  backend:
    name: transit-api — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build & test backend
        working-directory: services/transit-api
        run: ./gradlew build --no-daemon --console=plain

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-report
          path: services/transit-api/build/reports/tests/

  android:
    name: zagreb-android — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build debug APK + unit tests
        working-directory: apps/zagreb-android
        run: >
          ./gradlew :app:assembleDebug :app:testDebugUnitTest
          :shared:testDebugUnitTest --no-daemon --console=plain

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: zagreb-android-debug-apk
          path: apps/zagreb-android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            apps/zagreb-android/app/build/reports/tests/
            apps/zagreb-android/shared/build/reports/tests/
