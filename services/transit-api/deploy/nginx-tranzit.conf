# nginx vhost for tranzit.bus-split.com -> transit-api (127.0.0.1:8090).
#
# Install on the server as /etc/nginx/sites-available/tranzit.bus-split.com
# and symlink into sites-enabled. This is the PRE-TLS form (port 80 only);
# `certbot --nginx -d tranzit.bus-split.com` rewrites it to add the 443
# server block, the certificate paths, and an HTTP->HTTPS redirect.

server {
    listen 80;
    listen [::]:80;
    server_name tranzit.bus-split.com;

    # Proxy buffering off for the live RT feed so vehicle positions are not
    # held back; responses are small JSON and the app already caches upstream.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;
    }

    # Lightweight liveness path, handy for uptime checks straight through nginx.
    location = /health {
        proxy_pass http://127.0.0.1:8090/health;
        access_log off;
    }
}
